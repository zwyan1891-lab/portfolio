<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DIAOUHA | وكالة عقارية في موريتانيا</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fa;
  color:#172033;
  line-height:1.7;
}

header{
  background:#101827;
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#d6ad60;
}

nav a{
  color:white;
  text-decoration:none;
  margin-right:22px;
  font-size:15px;
}

.hero{
  min-height:500px;
  display:flex;
  align-items:center;
  background:
  linear-gradient(rgba(10,20,35,.65),rgba(10,20,35,.65)),
  url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80")
  center/cover;
  color:white;
  padding:70px 7%;
}

.hero-content{
  max-width:650px;
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero p{
  font-size:19px;
  margin-bottom:28px;
}

.btn{
  display:inline-block;
  background:#d6ad60;
  color:#101827;
  padding:13px 25px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin:5px;
}

.btn.dark{
  background:white;
}

section{
  padding:60px 6%;
}

.title{
  text-align:center;
  margin-bottom:40px;
}

.title h2{
  font-size:32px;
  margin-bottom:8px;
}

.title p{
  color:#667085;
}

.properties{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:20px;
}

.card h3{
  font-size:20px;
  margin-bottom:8px;
}

.location{
  color:#667085;
  font-size:14px;
  margin-bottom:10px;
}

.price{
  color:#b78938;
  font-size:20px;
  font-weight:bold;
  margin:12px 0;
}

.details{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #eee;
  padding-top:12px;
  font-size:14px;
}

.about{
  background:#101827;
  color:white;
}

.about-box{
  max-width:900px;
  margin:auto;
  text-align:center;
}

.about-box h2{
  font-size:32px;
  margin-bottom:20px;
}

.about-box p{
  color:#d5d9e0;
  font-size:17px;
}

.services{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.service{
  background:white;
  padding:30px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.service-icon{
  font-size:45px;
  margin-bottom:15px;
}

.contact{
  text-align:center;
}

.contact-box{
  background:white;
  max-width:700px;
  margin:auto;
  padding:35px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.whatsapp{
  background:#25D366;
  color:white;
}

footer{
  background:#0b111d;
  color:#aaa;
  text-align:center;
  padding:25px;
  font-size:14px;
}

@media(max-width:800px){

  header{
    flex-direction:column;
    gap:12px;
  }

  nav a{
    margin:0 7px;
    font-size:13px;
  }

  .hero{
    min-height:550px;
    text-align:center;
    justify-content:center;
  }

  .hero h1{
    font-size:35px;
  }

  .hero p{
    font-size:16px;
  }
