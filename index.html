<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIAOUHA | وكالة عقارية</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f6f8;
color:#222;
}
header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0;color:#d1d5db}

nav{
background:white;
padding:12px;
text-align:center;
position:sticky;
top:0;
z-index:5;
box-shadow:0 2px 8px #0001;
}
nav a{
margin:0 8px;
text-decoration:none;
color:#111827;
font-weight:bold;
}

.hero{
padding:55px 20px;
text-align:center;
background:linear-gradient(135deg,#1f2937,#374151);
color:white;
}
.hero h2{font-size:34px;margin:0 0 15px}
.hero p{font-size:18px;color:#e5e7eb}

.btn{
display:inline-block;
padding:13px 22px;
background:#16a34a;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
margin-top:10px;
}

section{
padding:35px 18px;
max-width:1100px;
margin:auto;
}
section h2{text-align:center;margin-bottom:25px}

.search{
background:white;
padding:18px;
border-radius:15px;
box-shadow:0 3px 12px #0001;
margin-bottom:25px;
}
.search input,.search select{
width:100%;
padding:13px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 15px #0001;
}
.card img{
width:100%;
height:190px;
object-fit:cover;
}
.card-content{padding:17px}
.card h3{margin-top:0}
.price{
font-size:20px;
font-weight:bold;
color:#16a34a;
}
.location{color:#666}

footer{
background:#111827;
color:white;
text-align:center;
padding:25px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>DIAOUHA</h1>
<p>وكالة عقارية في موريتانيا</p>
</header>

<nav>
<a href="#home">الرئيسية</a>
<a href="#properties">العقارات</a>
<a href="#about">من نحن</a>
<a href="#contact">تواصل</a>
</nav>

<div class="hero" id="home">
<h2>ابحث عن عقارك بسهولة</h2>
<p>منازل، شقق، أراضٍ، مكاتب ومحلات في موريتانيا</p>
<a class="btn" href="#properties">تصفح العقارات</a>
</div>

<section id="properties">

<h2>العقارات المتاحة</h2>
